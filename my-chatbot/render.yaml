# Blueprint for Render.com. For the static site: do not set a per-service Root Directory
# in the Render dashboard unless you change paths below. Frontend build/publish is defined
# from the repo root: see ../DEPLOY.md
#
# - Vite bakes VITE_API_URL at static build: we pull the API service RENDER_EXTERNAL_URL
#   so the live site calls your API (and Postgres) instead of localhost.
# - The API does not need the static URL in CORS: config/settings.py allows
#   https://*.onrender.com when RENDER is set (CORS_TRUST_ONRENDER, default on).
# - ALLOWED_HOSTS includes the hostname from RENDER_EXTERNAL_URL on the API service.
services:
  - type: web
    name: reading-chatbot-api
    runtime: python
    # Starter ($7/mo): no spin-down (no cold starts), 512 MB RAM, shell access,
    # and full feature set. Required for a real study so children don't wait
    # ~1 min on the first request of the day.
    plan: starter
    rootDir: my-chatbot/backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: OPENAI_API_KEY
        sync: false                 # set in Render dashboard, never in the repo
      - key: DATABASE_URL
        fromDatabase:
          name: reading-chatbot-db
          property: connectionString
      - key: DATABASE_SSL_REQUIRE
        value: "true"
      # ---- Study configuration ----
      # Enrollment codes (case-insensitive). sync: false → set in dashboard so
      # they aren't committed to the repo. Defaults pre-filled locally only.
      - key: STUDY_CODES_PERSONALIZED
        sync: false
      - key: STUDY_CODES_GENERIC
        sync: false
      - key: STUDY_CODES_CONTROL
        sync: false
      - key: STUDY_START_DATE
        value: "2026-05-11"
      - key: STUDY_TIMEZONE
        value: "Europe/Lisbon"
      - key: STUDY_TOTAL_WEEKS
        value: "3"
      - key: STUDY_INACTIVITY_SECONDS
        value: "1500"
      - key: STUDY_DAY_SPACING_ENFORCED
        value: "true"
      - key: STUDY_ROTATE_TOKEN_ON_LOGIN
        value: "true"
      - key: STUDY_PIN_MIN_LENGTH
        value: "4"
      - key: STUDY_PIN_MAX_LENGTH
        value: "6"
      - key: STUDY_LOGIN_CODE_LENGTH
        value: "10"

  # No rootDir: static publish path is from the repo root (see Render monorepo docs).
  # Build explicitly enters my-chatbot/ so Vite outputs to my-chatbot/dist.
  - type: web
    name: reading-chatbot-frontend
    runtime: static
    buildCommand: cd my-chatbot && npm install && npm run build
    staticPublishPath: my-chatbot/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: reading-chatbot-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: reading-chatbot-db
    # Starter ($7/mo): persistent, no 30-day expiry, automatic daily backups
    # with 7-day retention, point-in-time recovery. Essential for a study
    # whose data will be analysed and cited.
    plan: starter
    databaseName: reading_chatbot
    user: reading_chatbot_user
